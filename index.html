<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manual Técnico - Sistemas Automotivos</title>
    <link rel="stylesheet" href="estilo.css">
</head>

<body>

    <!-- TOPO EXCLUSIVO DO CELULAR -->
    <header class="barra-topo-mobile">
        <strong>Manual Técnico</strong>
        <button type="button" class="btn-menu-toggle" id="btn-menu"
                aria-label="Abrir menu" aria-expanded="false">
            ☰
        </button>
    </header>

    <!-- FUNDO ESCURO QUANDO O MENU MOBILE ESTÁ ABERTO -->
    <div class="overlay" id="overlay"></div>

    <!-- MENU -->
    <nav id="menu-lateral" aria-label="Menu principal">

        <div class="menu-cabecalho">
            <h2>Manual Técnico</h2>

            <!-- HOME FICA DENTRO DO MENU: NÃO SOBREPOE OS ITENS -->
            <a href="index.html" class="btn-home">🏠 Home</a>
        </div>

        <div class="item-menu">
            <button type="button" class="btn-principal" data-menu="lubrificacao"
                    aria-expanded="false">
                <span>Sistema de Lubrificação</span>
                <span class="seta">▼</span>
            </button>
            <ul id="lubrificacao" class="submenu">
                <li><button type="button" data-conteudo="tab_lubrificacao">Tabela de Lubrificação</button></li>
                <li><button type="button" data-conteudo="luz_pressao">Luz e Pressão</button></li>
            </ul>
        </div>

        <div class="item-menu">
            <button type="button" class="btn-principal" data-menu="eletrico"
                    aria-expanded="false">
                <span>Sistema Elétrico</span>
                <span class="seta">▼</span>
            </button>
            <ul id="eletrico" class="submenu">
                <li><button type="button" data-conteudo="fusiveis">Fusíveis e Lâmpadas</button></li>
                <li><button type="button" data-conteudo="farol">Farol e Seta</button></li>
            </ul>
        </div>

        <div class="item-menu">
            <button type="button" class="btn-principal" data-menu="combustivel"
                    aria-expanded="false">
                <span>Linha Combustível</span>
                <span class="seta">▼</span>
            </button>
            <ul id="combustivel" class="submenu">
                <li><button type="button" data-conteudo="tanque">Tanque, Filtro, Mang.</button></li>
                <li><button type="button" data-conteudo="bomba_eletrica">Bomba Elétrica</button></li>
                <li><button type="button" data-conteudo="bomba_engrenagem">Bomba Engrenagem</button></li>
                <li><button type="button" data-conteudo="valvula_kuv">Válvula KUV</button></li>
                <li><button type="button" data-conteudo="bomba_alta">Bomba Alta Pressão</button></li>
                <li><button type="button" data-conteudo="tubo_rail">Tubo Rail</button></li>
            </ul>
        </div>

        <div class="item-menu">
            <button type="button" class="btn-principal" data-menu="sensores"
                    aria-expanded="false">
                <span>Sensores e Atuadores</span>
                <span class="seta">▼</span>
            </button>
            <ul id="sensores" class="submenu">
                <li><button type="button" data-conteudo="valvula_mprop">Válvula MProp</button></li>
                <li><button type="button" data-conteudo="sensor_rotacao">Sensor Rotação</button></li>
                <li><button type="button" data-conteudo="sensor_fase">Sensor Fase</button></li>
                <li><button type="button" data-conteudo="sensor_pres_adm">Sensor Pres. Adm</button></li>
                <li><button type="button" data-conteudo="pedal_acelerador">Pedal Acelerador</button></li>
                <li><button type="button" data-conteudo="sensor_temp_ecm">Sensor Temp. ECM</button></li>
                <li><button type="button" data-conteudo="modulador_turbina">Modulador Turbina</button></li>
                <li><button type="button" data-conteudo="sensor_pres_rail">Sensor Pres. Rail</button></li>
                <li><button type="button" data-conteudo="bicos_injetores">Bicos Injetores</button></li>
            </ul>
        </div>

        <div class="item-menu">
            <button type="button" class="btn-principal" data-menu="admissao"
                    aria-expanded="false">
                <span>Admissão e Escape</span>
                <span class="seta">▼</span>
            </button>
            <ul id="admissao" class="submenu">
                <li><button type="button" data-conteudo="filtros_mangueiras">Filtros e Mangueiras</button></li>
                <li><button type="button" data-conteudo="turbina">Turbina</button></li>
            </ul>
        </div>

        <div class="item-menu">
            <button type="button" class="btn-principal" data-menu="direcao"
                    aria-expanded="false">
                <span>Sistema de Direção</span>
                <span class="seta">▼</span>
            </button>
            <ul id="direcao" class="submenu">
                <li><button type="button" data-conteudo="bomba_direcao">Bomba de Direção</button></li>
                <li><button type="button" data-conteudo="caixa_direcao">Caixa de Direção</button></li>
                <li><button type="button" data-conteudo="oleo_direcao">Óleo de Direção</button></li>
            </ul>
        </div>

        <div class="item-menu">
            <button type="button" class="btn-principal" data-menu="freios"
                    aria-expanded="false">
                <span>Sistemas de Freios</span>
                <span class="seta">▼</span>
            </button>
            <ul id="freios" class="submenu">
                <li><button type="button" data-conteudo="bomba_vacuo">Bomba de Vácuo</button></li>
                <li><button type="button" data-conteudo="freios_traseiros">Freios Traseiros / Mão</button></li>
            </ul>
        </div>

    </nav>

    <!-- CONTEÚDO -->
    <main>
        <section class="caixa-conteudo">
            <h1 id="titulo-sistema">Bem-vindo ao Manual Técnico</h1>
            <div id="categoria-sistema">Sistemas Automotivos</div>
            <p id="texto-sistema">
                Selecione uma categoria no menu e depois um componente
                para visualizar as informações técnicas.
            </p>
        </section>
    </main>

    <!-- VOLTAR AO TOPO -->
    <button type="button" id="btn-inicio" class="btn-inicio"
            title="Voltar ao início" aria-label="Voltar ao início">
        ↑
    </button>

    <!-- ARQUIVO JS NA MESMA PASTA DO INDEX -->
    <script src="menu.js"></script>
</body>
</html>
