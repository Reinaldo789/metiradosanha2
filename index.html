<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mega Menu - Guia Técnico</title>

  <!-- Ícones Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    /* ==========================================
       1. ESTILOS BASE E CORES
       ========================================== */
    :root {
      --bg-page: #eef2ff;
      --card-bg: #ffffff;
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --primary-light: #f5f3ff;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
      --transition: all 0.2s ease-in-out;
    }

    html, body {
      width: 100%;
      min-height: 100vh;
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      background-color: var(--bg-page);
      color: var(--text-main);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    *, *:before, *:after { box-sizing: inherit; }

    .site-wrapper {
      position: relative;
      width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ==========================================
       2. CABEÇALHO SUPERIOR (NAVBAR)
       ========================================== */
    header {
      background: rgba(255, 255, 255, 0.98);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 1000;
      width: 100%;
    }

    .nav-container {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem 1.5rem;
      position: relative;
    }

    .logo {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--primary);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .main-nav {
      display: flex;
      list-style: none;
      gap: 0.5rem;
      margin: 0;
      padding: 0;
    }

    .nav-item {
      position: static;
      padding-bottom: 10px;
      margin-bottom: -10px;
    }

    .nav-btn {
      background: transparent;
      border: none;
      color: var(--text-main);
      font-weight: 600;
      font-size: 0.9rem;
      padding: 0.6rem 0.8rem;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      transition: var(--transition);
      text-decoration: none;
    }

    .nav-btn i.fa-chevron-down {
      font-size: 0.75rem;
      transition: var(--transition);
    }

    .mobile-toggle {
      display: none;
      background: none;
      border: none;
      font-size: 1.4rem;
      color: var(--text-main);
      cursor: pointer;
    }

    /* ==========================================
       3. MEGA MENU DROPDOWN (DESKTOP)
       ========================================== */
    .mega-menu {
      position: absolute;
      top: 100%;
      left: 1.5rem;
      right: 1.5rem;
      width: auto;
      max-width: 1150px;
      margin: 0 auto;
      max-height: calc(85vh - 70px);
      overflow-y: auto;
      background: var(--card-bg);
      border-radius: 16px;
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--border-color);
      padding: 1.5rem;
      opacity: 0;
      visibility: hidden;
      transform: translateY(10px);
      transition: var(--transition);
      z-index: 1001;
      display: grid;
      grid-template-columns: 3fr 1fr;
      gap: 1.5rem;
    }

    .mega-menu::-webkit-scrollbar {
      width: 6px;
    }
    .mega-menu::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }

    /* HOVER DESKTOP */
    @media (min-width: 961px) {
      .nav-item:hover > .nav-btn {
        background-color: var(--primary-light);
        color: var(--primary);
      }

      .nav-item:hover > .nav-btn i.fa-chevron-down {
        transform: rotate(180deg);
      }

      .nav-item:hover .mega-menu {
        opacity: 1;
        visibility: visible;
        transform: translateY(0);
      }
    }

    .mega-categories-container {
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }

    .category-group {
      border-bottom: 1px solid #f1f5f9;
      padding-bottom: 1rem;
    }

    .category-group:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .category-title {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--primary);
      font-weight: 700;
      margin-bottom: 0.6rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .mega-links-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.5rem;
    }

    .mega-link-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.4rem 0.6rem;
      border-radius: 6px;
      text-decoration: none;
      color: var(--text-main);
      font-size: 0.85rem;
      transition: var(--transition);
    }

    .mega-link-item:hover {
      background-color: var(--primary-light);
      color: var(--primary);
    }

    .mega-link-item i {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .mega-link-item:hover i {
      color: var(--primary);
    }

    /* Painel Lateral Explore */
    .mega-explore-side {
      background-color: #fafafa;
      border-radius: 12px;
      padding: 1rem;
      border: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .explore-header-title {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      font-weight: 700;
      margin-bottom: 0.8rem;
    }

    .explore-banner {
      background-color: #312e81;
      color: white;
      border-radius: 10px;
      padding: 1rem;
      text-align: center;
      margin-bottom: 0.8rem;
    }

    .explore-banner i {
      font-size: 1.8rem;
      margin-bottom: 0.4rem;
      color: #818cf8;
    }

    .explore-banner h5 {
      margin: 0 0 0.2rem 0;
      font-size: 0.9rem;
    }

    .explore-banner p {
      margin: 0;
      font-size: 0.75rem;
      opacity: 0.8;
    }

    .explore-link {
      color: var(--primary);
      text-decoration: none;
      font-weight: 700;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }

    /* ==========================================
       4. CONTEÚDO DA PÁGINA
       ========================================== */
    main {
      flex-grow: 1;
      padding: 3rem 1.5rem;
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
    }

    .hero-box {
      text-align: center;
      padding: 3rem 1rem;
      background: white;
      border-radius: 20px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border-color);
    }

    .hero-title-bg {
      font-size: clamp(2rem, 6vw, 4rem);
      font-weight: 900;
      color: rgba(79, 70, 229, 0.15);
      margin: 0;
      line-height: 1;
      text-transform: uppercase;
    }

    .hero-title-main {
      font-size: clamp(1.5rem, 4vw, 2.2rem);
      color: var(--text-main);
      margin-top: -1rem;
      font-weight: 800;
    }

    .hero-sub {
      color: var(--text-muted);
      font-size: 0.95rem;
      max-width: 600px;
      margin: 0.8rem auto 0 auto;
    }

    /* ==========================================
       5. BOTÃO FLUTUANTE (VOLTAR AO TOPO)
       ========================================== */
    .floating-container {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 999;
    }

    .float-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      font-size: 1.2rem;
      background-color: var(--primary);
      box-shadow: var(--shadow-lg);
      border: none;
      cursor: pointer;
      transition: var(--transition);
      opacity: 0;
      pointer-events: none;
    }

    .float-btn:hover {
      background-color: var(--primary-hover);
      transform: translateY(-3px);
    }

    .float-btn.visible {
      opacity: 1;
      pointer-events: auto;
    }

    /* ==========================================
       6. ESTILOS MOBILE (COM ROLAGEM CORRIGIDA)
       ========================================== */
    @media (max-width: 960px) {
      .mobile-toggle { display: block; }

      .main-nav {
        display: none;
        position: fixed;
        top: 60px;
        left: 0;
        right: 0;
        bottom: 0;
        width: 100%;
        height: calc(100vh - 60px);
        background: #f8fafc;
        flex-direction: column;
        padding: 1rem 1rem 3rem 1rem;
        border-bottom: 1px solid var(--border-color);
        box-shadow: var(--shadow-lg);
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        gap: 0.8rem;
        z-index: 999;
      }

      .main-nav.active { 
        display: flex; 
      }

      .nav-item {
        padding-bottom: 0;
        margin-bottom: 0;
        position: relative;
        background: #ffffff;
        border: 1px solid var(--border-color);
        border-radius: 12px;
        overflow: hidden;
        box-shadow: var(--shadow-sm);
        flex-shrink: 0;
      }

      .nav-btn {
        width: 100%;
        justify-content: space-between;
        padding: 1rem 1.2rem;
        font-size: 0.95rem;
        background: white;
        border-radius: 0;
      }

      .nav-item.active .nav-btn {
        background-color: var(--primary-light);
        color: var(--primary);
        font-weight: 700;
      }

      .mega-menu {
        position: static;
        left: auto;
        right: auto;
        transform: none !important;
        width: 100%;
        box-shadow: none;
        border: none;
        border-top: 1px solid var(--border-color);
        padding: 1rem;
        display: none;
        grid-template-columns: 1fr;
        opacity: 1;
        visibility: visible;
        max-height: 55vh;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        background: #ffffff;
      }

      .nav-item.active .mega-menu {
        display: block;
      }

      .nav-item.active > .nav-btn i.fa-chevron-down {
        transform: rotate(180deg);
      }

      .mega-links-grid {
        grid-template-columns: 1fr;
        gap: 0.4rem;
      }

      .mega-link-item {
        padding: 0.65rem 0.8rem;
        background: #f8fafc;
        border-radius: 6px;
      }

      .mega-explore-side {
        margin-top: 1.2rem;
      }
    }
  </style>
</head>
<body>

  <div class="site-wrapper">

    <!-- CONTAINER ONDE O MENU SERÁ INJETADO VIA FETCH -->
    <div id="menu-container"></div>

    <!-- CONTEÚDO PRINCIPAL -->
    <main>
      <div class="hero-box">
        <h1 class="hero-title-bg">Mega Menu</h1>
        <div class="hero-title-main">Portal de Especificações Técnicas</div>
        <p class="hero-sub">Menu carregado via fetch assíncrono com suporte total a navegação mobile.</p>
      </div>
    </main>

  </div>

  <!-- BOTÃO FLUTUANTE DE ROLAR PARA CIMA -->
  <div class="floating-container">
    <button class="float-btn" id="btn-top" title="Voltar ao Topo" aria-label="Voltar ao topo">
      <i class="fa-solid fa-arrow-up"></i>
    </button>
  </div>

  <!-- JAVASCRIPT -->
  <script>
    // Função para carregar o menu via fetch
    async function loadMenu() {
      try {
        const response = await fetch('menu.html');
        if (!response.ok) throw new Error('Erro ao carregar o menu');
        const html = await response.text();
        
        // Injeta o HTML no container
        document.getElementById('menu-container').innerHTML = html;
        
        // Inicializa os scripts do menu logo após o carregamento
        initMenuEvents();
      } catch (error) {
        console.error('Erro na requisição do menu:', error);
      }
    }

    // Inicialização dos eventos do menu
    function initMenuEvents() {
      const navItems = document.querySelectorAll('.nav-item');
      const mobileToggleBtn = document.getElementById('mobile-toggle-btn');
      const mainNav = document.getElementById('main-nav');
      if (!mobileToggleBtn || !mainNav) return;
      
      const toggleIcon = mobileToggleBtn.querySelector('i');

      // Lógica Accordion no Mobile
      navItems.forEach(item => {
        const btn = item.querySelector('.nav-btn');
        if (!btn) return;
        
        btn.addEventListener('click', (e) => {
          if (window.innerWidth <= 960) {
            e.preventDefault();
            const isActive = item.classList.contains('active');
            
            navItems.forEach(otherItem => otherItem.classList.remove('active'));

            if (!isActive) {
              item.classList.add('active');
              setTimeout(() => {
                item.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
              }, 100);
            }
          }
        });
      });

      // Toggle Menu Hambúrguer
      mobileToggleBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        const isOpen = mainNav.classList.toggle('active');
        
        if (isOpen) {
          document.body.style.overflow = 'hidden';
        } else {
          document.body.style.overflow = '';
        }

        navItems.forEach(item => item.classList.remove('active'));

        if (isOpen) {
          toggleIcon.classList.remove('fa-bars');
          toggleIcon.classList.add('fa-xmark');
        } else {
          toggleIcon.classList.remove('fa-xmark');
          toggleIcon.classList.add('fa-bars');
        }
      });
    }

    // Botão Voltar ao Topo
    const btnTop = document.getElementById('btn-top');
    window.addEventListener('scroll', () => {
      if (window.scrollY > 150) {
        btnTop.classList.add('visible');
      } else {
        btnTop.classList.remove('visible');
      }
    });

    btnTop.addEventListener('click', () => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    // Executa a carga do menu ao carregar a página
    document.addEventListener('DOMContentLoaded', loadMenu);
  </script>

</body>
</html>
