<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guia Técnico - Manual de Manutenção</title>
  
  <!-- Ícones Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    /* ==========================================
       1. ESTILOS BASE E VARIÁVEIS
       ========================================== */
    :root {
      --tabs-bg: #eef2ff;          /* Fundo exterior da página */
      --tab-active-bg: #ffffff;    /* Fundo do painel e aba ativa */
      --primary: #4f46e5;          /* Cor primária (roxo/azul) */
      --primary-hover: #4338ca;
      --primary-light: #f5f3ff;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
    }

    *, *:before, *:after {
      box-sizing: border-box;
    }

    body {
      width: 100%;
      min-height: 100vh;
      margin: 0;
      padding: 2rem 1.5rem;
      background-color: var(--tabs-bg);
      color: var(--text-main);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    .tabs-wrapper {
      max-width: 1100px;
      margin: 0 auto;
    }

    /* ==========================================
       2. CABEÇALHO DAS ABAS (TABS HEADER)
       ========================================== */
    .tabs-header {
      display: flex;
      gap: 0.3rem;
      padding-left: 1.5rem;
      overflow-x: auto;
      scrollbar-width: none; /* Firefox */
    }

    .tabs-header::-webkit-scrollbar {
      display: none; /* Chrome/Safari */
    }

    .tab-btn {
      position: relative;
      background: transparent;
      border: none;
      padding: 0.85rem 1.5rem;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      border-top-left-radius: 14px;
      border-top-right-radius: 14px;
      transition: color 0.2s ease, background-color 0.2s ease
