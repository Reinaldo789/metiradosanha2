<!-- ESTILOS EXCLUSIVOS PARA COMPATIBILIDADE COM O DESIGN DO SEU SITE -->
<style>
  .diagram-master-container {
    display: flex;
    align-items: center;
    justify-content: space-between;
    max-width: 100%;
    background: #ffffff;
    border: 2px solid #cbd5e1;
    border-radius: 12px;
    padding: 20px;
    margin: 20px 0;
    box-shadow: var(--shadow-sm, 0 1px 3px rgba(0,0,0,0.05));
  }

  /* Molduras Laterais Fixas (Componente e Módulo) */
  .diagram-frame-box {
    border: 3px solid #0f172a;
    background: #ffffff;
    padding: 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 190px;
    text-align: center;
  }
  .frame-left-side { width: 140px; }
  .frame-right-side { width: 165px; }

  .diagram-frame-box img {
    max-width: 100%;
    height: auto;
    object-fit: contain;
  }
  
  .diagram-frame-box span {
    font-size: 11px;
    font-weight: bold;
    color: #475569;
    margin-top: 8px;
  }

  /* Área Central do Chicote de Fios (Construção Rígida em Tabela) */
  .diagram-harness-table-wrapper {
    flex: 1;
    padding: 0 15px;
  }

  .harness-wire-table {
    width: 100%;
    border-collapse: collapse;
  }

  .harness-wire-table td {
    padding: 0;
    vertical-align: middle;
    height: 44px; /* Altura fixa para manter linhas paralelas simétricas */
  }

  /* Células das Tags de Pinagem Redondas/Quadradas */
  .cell-pin-sensor { width: 32px; }
  .cell-pin-ecu { width: 45px; }

  .pin-tag-style {
    font-size: 11px;
    font-weight: bold;
    color: #0f172a;
    background: #ffffff;
    border: 2px solid #0f172a;
    width: 26px;
    height: 26px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 4px;
    margin: 0 auto;
  }

  /* Canal Elétrico Central (O Fio Físico) */
  .cell-wire-conduit {
    position: relative;
    padding: 0 4px;
  }
  
  .wire-line-body {
    height: 4px;
    width: 100%;
    border-radius: 2px;
    border: 1px solid #1e293b;
  }

  .wire-text-overlay {
    position: absolute;
    top: -10px;
    left: 15px;
    font-size: 10px;
    font-weight: 800;
    color: #1e293b;
    background: #ffffff;
    padding: 0 6px;
    white-space: nowrap;
    border-radius: 2px;
  }

  /* MODELAGEM DE CORES E ZEBRADOS EM CSS PURO */
  .color-ll { background-color: #d8b4fe; } /* Lilás / Roxo */
  
  /* Fio listrado Verde e Amarelo (0,5 VD/AM) */
  .color-vd-am {
    background: linear-gradient(90deg, #22c55e 35%, #eab308 35%, #eab308 50%, #22c55e 50%, #22c55e 85%, #eab308 85%);
    background-size: 20px 100%;
  }

  /* Fio listrado Branco e Preto (0,5 BR/PR) */
  .color-br-pr {
    background: linear-gradient(90deg, #ffffff 35%, #000000 35%, #000000 50%, #ffffff 50%, #ffffff 85%, #000000 85%);
    background-size: 20px 100%;
  }

  /* Responsividade para Dispositivos Móveis */
  @media (max-width: 768px) {
    .diagram-master-container { flex-direction: column; gap: 15px; }
    .frame-left-side, .frame-right-side { width: 100%; min-height: auto; }
    .diagram-harness-table-wrapper { width: 100%; padding: 0; }
    .harness-wire-table td { height: auto; display: block; width: 100%; text-align: center; }
    .harness-wire-table tr { display: flex; flex-direction: column; gap: 4px; margin-bottom: 15px; border-bottom: 1px dashed #cbd5e1; padding-bottom: 10px; }
    .wire-line-body { height: 6px; margin: 4px 0; }
    .wire-text-overlay { position: static; display: inline-block; padding: 0; }
  }
</style>

<div class="aviso">
  <strong>Mapeamento do Sensor CKP:</strong> Estrutura estável travada por tabela de alinhamento rígido. Assegura a leitura sem distorções no monitor do computador ou celular.
</div>
