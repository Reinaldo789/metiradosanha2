<!-- ESTILOS DO MAPA VISUAL INTERATIVO (DO UTOR IE / COMPACTO) -->
<style>
  .interactive-map-area {
    position: relative;
    max-width: 700px;
    margin: 20px auto;
    background-color: #f8fafc;
    border: 2px solid #cbd5e1;
    border-radius: 12px;
    overflow: hidden;
    /* Ajuste a altura proporcional à sua imagem de fundo */
    height: 650px; 
    box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05);
  }

  /* Imagem de Fundo com os Renders/Fotos dos Componentes */
  .map-background-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    position: absolute;
    top: 0;
    left: 0;
    z-index: 1;
    opacity: 0.95;
  }

  /* ZONAS DE INTERAÇÃO (BOTÕES INVISÍVEIS SOBRE OS COMPONENTES) */
  .component-hotspot {
    position: absolute;
    border: 2px dashed transparent;
    border-radius: 8px;
    cursor: pointer;
    z-index: 3;
    transition: all 0.25s ease;
  }
  
  /* Efeito Hover: destaca o componente físico */
  .component-hotspot:hover {
    border-color: #4f46e5;
    background-color: rgba(79, 70, 229, 0.08);
    box-shadow: 0 0 15px rgba(79, 70, 229, 0.2);
  }

  /* POSICIONAMENTO DA MAQUETE (Baseado na sua imagem de referência) */
  .spot-bateria { top: 40px; left: 30px; width: 140px; height: 110px; }
  .spot-painel  { top: 40px; left: 240px; width: 280px; height: 130px; }
  .spot-ecu     { top: 230px; left: 130px; width: 150px; height: 140px; }
  .spot-boia    { top: 420px; left: 40px; width: 150px; height: 160px; }
  .spot-temp    { top: 250px; left: 490px; width: 160px; height: 140px; }
  .spot-oleo    { top: 440px; left: 460px; width: 160px; height: 140px; }

  /* JANELA FLUTUANTE DE DIAGNÓSTICO (TOOLTIP DE PINAGEM) */
  .diag-hud-overlay {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    width: 90%;
    max-width: 500px;
    background: rgba(15, 23, 42, 0.95);
    backdrop-filter: blur(4px);
    color: #ffffff;
    border-radius: 8px;
    padding: 12px 18px;
    z-index: 4;
    font-size: 12px;
    box-shadow: 0 10px 20px rgba(0,0,0,0.3);
    border: 1px solid #334155;
    pointer-events: none;
    display: none; /* Aparece via JS */
  }
  .diag-hud-overlay strong { color: #38bdf8; font-size: 14px; display: block; margin-bottom: 2px; }
  .diag-hud-overlay em { color: #fbbf24; font-style: normal; font-weight: bold; }
</style>

<p class="art-lead">Mapa técnico interativo. Passe o mouse ou toque sobre qualquer componente do motor ou cabine para rastrear a pinagem e as cores oficiais do chicote do Marruá.</p>

<!-- CONTAINER DO MAPA GERAL -->
<div class="interactive-map-area" id="marruaMap">
  
  <!-- Imagem realista de fundo com os componentes posicionados -->
  <img src="img/esquema_realista_fundo.png" alt="Esquema Elétrico Ilustrado" class="map-background-img">

  <!-- CAPAS DE INTERAÇÃO (HOTSPOTS) -->
  <div class="component-hotspot spot-bateria" data-name="Bateria de Alimentação (12V)" data-info="Linha de força primária (+30). Conecta ao interruptor da chave geral por meio do cabo grosso de bitola 35,0VM (Vermelho)."></div>
  
  <div class="component-hotspot spot-painel" data-name="Painel Central de Instrumentos" data-info="Recebe os sinais de monitoramento. Luz de carga ligada ao alternador pelo fio <em>A(625)0,75 AZ/VM</em>. Linha de combustível ligada à boia pelo fio <em>A(060)1,0</em> (Pág 21)."></div>
  
  <div class="component-hotspot spot-ecu" data-name="Unidade de Comando - ECU EDC16" data-info="Gerenciador eletrônico do motor MWM. Conector 'A' de 60 vias e conector 'K' de 91 vias recebem alimentação pós-chave (+15) protegida pelo <em>Fusível 25 (5A)</em>."></div>
  
  <div class="component-hotspot spot-boia" data-name="Sensor de Nível de Combustível (Boia)" data-info="Instalado no tanque traseiro. Envia sinal resistivo ao painel através do cabo <em>B(060)1,0</em>. Linha de massa ligada ao chassi pelo fio <em>B(110)1,0 MA</em> (Marrom)."></div>
  
  <div class="component-hotspot spot-temp" data-name="Sensor de Temperatura da Água (MWM)" data-info="Localizado no bloco do motor. Comunica-se diretamente com o indicador do painel através do cabo bicolor de código <em>C(38)0,75 AZ/AM</em> (Azul com listra Amarela)."></div>
  
  <div class="component-hotspot spot-oleo" data-name="Sensor de Pressão do Óleo" data-info="Monitora a lubrificação crítica do motor. Envia sinal para o manômetro e luz espia do painel através do fio elétrico <em>I(01)0,75 VD/VM</em> (Verde com listra Vermelha)."></div>

  <!-- HUD FLUTUANTE QUE MOSTRA OS DADOS DO MANUAL -->
  <div class="diag-hud-overlay" id="diagHud">
    <strong id="hudTitle">Componente</strong>
    <p id="hudDesc">Passe o mouse para ver os detalhes da fiação técnica do manual.</p>
  </div>

</div>

<!-- SCRIPT DE INTERAÇÃO DINÂMICA (COMPATÍVEL COM SEU GITHUB PAGES) -->
<script>
  (function() {
    const mapContainer = document.getElementById('marruaMap');
    const hud = document.getElementById('diagHud');
    const hudTitle = document.getElementById('hudTitle');
    const hudDesc = document.getElementById('hudDesc');
    const hotspots = mapContainer.querySelectorAll('.component-hotspot');

    hotspots.forEach(spot => {
      // Quando o mouse entra no componente
      spot.addEventListener('mouseenter', () => {
        hudTitle.textContent = spot.getAttribute('data-name');
        hudDesc.innerHTML = spot.getAttribute('data-info');
        hud.style.display = 'block';
      });

      // Quando o mouse sai do componente
      spot.addEventListener('mouseleave', () => {
        hud.style.display = 'none';
      });
    });
  })();
</script>
