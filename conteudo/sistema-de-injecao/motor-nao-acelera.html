const RX=/^(?:([A-Z])\((\d+[ab]?)\))?(\d+,\d+)([A-Z/]*)$/;
const pr=s=>{const m=RX.exec(s);return m?{h:m[1],f:m[2],s:m[3],c:m[4]?m[4].split("/"):[]}:null};
const MAP={};C.forEach(c=>{c.W=[...new Set(c.w.split(" "))].map(s=>({raw:s,...pr(s)}));c.W.forEach(w=>{if(w.f){(MAP[w.f]=MAP[w.f]||new Set()).add(c.p)}})});
const $=id=>document.getElementById(id),m=$("m");
const lk=ps=>[...ps].sort((a,b)=>a-b).map(p=>`<a class="chip" href="#c${p}">pág. ${p}</a>`).join("");
const cor=cs=>cs.length?cs.map(x=>{const k=COR[x];return k?`<span class="sw" style="background:${k[1]}"></span>${k[0]}`:x}).join(" / "):'<span title="Cor não indicada nesta página; ver numeração gravada no fio (Anexo F)">—</span>';
function nav(cur){let h='<input id="q" placeholder="Buscar fio/função (ex.: 250, farol, ré)" oninput="busca(this.value)"><h4>Anexos</h4>';
[["comp","Componentes e terminais"],["ler","Como ler os códigos"],["fus","Tabela de fusíveis"],["chi","Chicotes e cabos"],["fn","Funções dos fios (Anexo B)"]].forEach(a=>h+=`<a href="#${a[0]}" class="${cur==a[0]?"on":""}">${a[1]}</a>`);
h+="<h4>Circuitos</h4>";C.forEach(c=>h+=`<a href="#c${c.p}" class="${cur=="c"+c.p?"on":""}"><b>${c.p}</b>${c.t}</a>`);$("nav").innerHTML=h}
function circ(p){const i=C.findIndex(c=>c.p==p),c=C[i];let h=`<h2>${c.t}</h2><p class="sub">Página ${c.p} do diagrama DE 611.001</p>`;
if(c.fu.length)h+="<p>Fusíveis: "+c.fu.map(n=>{const f=FU.find(x=>x[0]==n);return`<a class="chip" href="#fus">F${n} · ${f[3]} A</a>`}).join("")+"</p>";
h+=`<div class="box"><b>Componentes:</b> ${c.comp}${c.ecu?`<br><b>ECU:</b> ${c.ecu}`:""}</div>`;
const bar=w=>{const s=parseFloat(w.s.replace(",","."));const hh=Math.max(3,Math.round(4*Math.sqrt(s)));const cs=w.c.map(x=>(COR[x]||[0,"#bbb"])[1]);const bg=!cs.length?"repeating-linear-gradient(90deg,#d5d8e2 0 8px,#fff 8px 16px)":cs.length==1?cs[0]:"repeating-linear-gradient(90deg,"+cs.map((c,i)=>c+" "+i*14+"px "+(i+1)*14+"px").join(",")+")";return`<div class="vw"><span class="bar" style="height:${hh}px;background:${bg}"></span><code>${w.raw}</code><small>${w.f&&F[w.f]?F[w.f]:""}</small></div>`};
h+=`<details open><summary><b>Visual dos fios</b> (espessura = seção; cor = cor do fio; tracejado cinza = cor não indicada no desenho)</summary>${c.W.map(bar).join("")}</details>`;
h+='<div class="tw"><table><tr><th>Fio</th><th>Chicote</th><th>Função (Anexo B)</th><th>Seção</th><th>Cor</th><th>Continua / aparece em</th></tr>';
c.W.forEach(w=>{const o=w.f?[...MAP[w.f]].filter(x=>x!=c.p):[];
h+=`<tr><td><code>${w.raw}</code></td><td>${w.h?w.h+" – "+H[w.h]:"—"}</td><td>${w.f?`<a href="#b${w.f}">${w.f}</a> ${F[w.f]||'<i>numeração própria do cabo</i>'}`:"—"}</td><td>${w.s} mm²</td><td>${cor(w.c)}</td><td>${o.length?lk(o):"—"}</td></tr>`});
h+="</table></div>";
h+=`<div class="pg">${i?`<a href="#c${C[i-1].p}">← pág. ${C[i-1].p}</a>`:"<span></span>"}${C[i+1]?`<a href="#c${C[i+1].p}">pág. ${C[i+1].p} →</a>`:""}</div>`;m.innerHTML=h}
function fus(){let h='<h2>Tabela de fusíveis</h2><p class="sub">Anexo C</p><div class="tw"><table><tr><th>Nº</th><th>Pág.</th><th>Função</th><th>Amperagem</th></tr>';
FU.forEach(f=>h+=`<tr><td>F${f[0]}</td><td><a href="#c${f[1]}">${f[1]}</a></td><td>${f[2]}${f[4]?`<div class="box warn">${f[4]}</div>`:""}</td><td>${f[3]} A</td></tr>`);m.innerHTML=h+"</table></div>"}
function chi(){let h='<h2>Chicotes e cabos</h2><p class="sub">Anexo A: a letra antes do parêntese no código do fio.</p><div class="tw"><table><tr><th>Letra</th><th>Chicote</th></tr>';
for(const k in H)h+=`<tr><td><code>${k}</code></td><td>${H[k]}</td></tr>`;m.innerHTML=h+"</table></div>"}
function fn(f){let h='<h2>Funções dos fios</h2><p class="sub">Anexo B. Mostra em quais circuitos cada função aparece.</p><div class="tw"><table><tr><th>Item</th><th>Função</th><th>Circuitos</th></tr>';
Object.keys(F).filter(k=>!f||k==f).forEach(k=>h+=`<tr id="b${k}"><td><code>${k}</code></td><td>${F[k]}</td><td>${MAP[k]?lk(MAP[k]):"—"}</td></tr>`);m.innerHTML=h+"</table></div>"}

function wc(){const m={};K.forEach(k=>k[3].forEach(r=>(r[2].match(/[^\s{}]+(?:\{[^}]*\})?/g)||[]).forEach(t=>{const c=t.replace(/\{.*\}/,"");if(c!="—"){(m[c]=m[c]||new Set()).add(k[1])}})));return m}
function wtok(t,own,M){const mm=/^(.+?)(?:\{([A-Z/]+)\})?$/.exec(t),c=mm[1];if(c=="—")return"—";const w=pr(c)||{};const cs=mm[2]?mm[2].split("/"):(w.c||[]);const o=[...(M[c]||[])].filter(x=>x!=own);return`<div><code>${c}</code> ${w.s?w.s+" mm² ":""}${cs.length?cor(cs):""}${o.length?`<br><small>também em: ${o.join("; ")}</small>`:""}</div>`}
function comp(f){f=(f||"").toLowerCase();const M=wc();let h=`<h2>Componentes e terminais</h2><p class="sub">Para cada componente: terminal, fio ligado, destino e tensão esperada. Cobertura atual: págs. 9, 10 e 11 do diagrama.</p>
<div class="box warn">Tensões: o diagrama só imprime volts em poucos pontos (24 V no reostato da pág. 11 e 12 V no conector +30 da pág. 9). As demais seguem a convenção dos terminais: +30 bateria, +15 ignição, +58 lanternas, 31 massa. São valores esperados, não medidos.</div>
<input id="cf" value="${f}" placeholder="Filtrar por componente ou fio (ex.: farol, 805, relé)" style="width:100%;padding:8px;border:1px solid var(--l);border-radius:6px;font:inherit;margin:8px 0" oninput="comp(this.value);document.getElementById('cf').focus()">`;
K.filter(k=>!f||(k[1]+" "+k[2]+" "+k[3].map(r=>r.join(" ")).join(" ")).toLowerCase().includes(f)).forEach(k=>{
h+=`<h3>${k[1]} <a class="chip" href="#c${k[0]}">pág. ${k[0]}</a></h3><p class="sub">${k[2]}</p><div class="tw"><table><tr><th>Terminal</th><th>DIN</th><th>Fio(s)</th><th>Liga em</th><th>Tensão esperada</th></tr>`;
k[3].forEach(r=>h+=`<tr><td><b>${r[0]}</b></td><td>${r[1]||"—"}</td><td>${(r[2].match(/[^\s{}]+(?:\{[^}]*\})?/g)||["—"]).map(t=>wtok(t,k[1],M)).join("")}</td><td>${r[3]}</td><td>${V[r[4]]||r[4]}</td></tr>`);h+="</table></div>"});
m.innerHTML=h}
function ler(){m.innerHTML=`<h2>Como ler os códigos</h2><p class="sub">Anexos E e F</p>
<div class="box"><code>B(233)0,5</code>: letra <b>B</b> = chicote (Anexo A); <b>233</b> = função (Anexo B); <b>0,5</b> = seção em mm². Com cor: <code>B(33)0,5VM</code> = 0,5 mm², vermelho.</div>
<div class="box">Cores com barra são bicolores (<code>AZ/VM</code> = azul com vermelho). Fios como <code>6,0VM</code> ou <code>35,0VM</code> não pertencem aos chicotes principais.</div>
<div class="box">No fio físico, o primeiro dígito da marcação indica a cor: 0 preto, 1 marrom, 2 vermelho, 3 laranja, 4 amarelo, 5 verde, 6 azul, 7 violeta, 8 cinza, 9 branco. Onde o desenho não traz a cor, ela não está definida naquela página.</div>
<div class="box">Os quadros vermelhos numerados nas bordas dos desenhos ligam o mesmo fio entre páginas: a coluna "Continua / aparece em" lista as páginas onde a mesma função existe.</div>
<div class="box warn">Os desenhos com quadrados tracejados mostram componentes não fornecidos pela Agrale. Conferir sempre com o PDF original.</div>
<h3>Cores</h3><div class="tw"><table>${Object.keys(COR).map(k=>`<tr><td><code>${k}</code></td><td>${cor([k])}</td></tr>`).join("")}</table></div>`}
function busca(v){v=v.trim().toLowerCase();if(!v){route();return}
const r=Object.keys(F).filter(k=>k.startsWith(v)||F[k].toLowerCase().includes(v));
let h=`<h2>Busca: ${v}</h2><div class="tw"><table><tr><th>Item</th><th>Função</th><th>Circuitos</th></tr>`;
r.forEach(k=>h+=`<tr><td><code>${k}</code></td><td>${F[k]}</td><td>${MAP[k]?lk(MAP[k]):"—"}</td></tr>`);
const ct=C.filter(c=>c.t.toLowerCase().includes(v));m.innerHTML=h+"</table></div>"+(ct.length?"<p>Circuitos: "+ct.map(c=>`<a class="chip" href="#c${c.p}">${c.p} · ${c.t}</a>`).join("")+"</p>":"")}
let cur=location.hash.slice(1);
function route(){const h=cur||"c9";nav(h);window.scrollTo(0,0);
if(/^c\d+$/.test(h))circ(+h.slice(1));else if(h=="fus")fus();else if(h=="chi")chi();else if(h=="comp")comp();else if(h=="ler")ler();else if(h[0]=="b"){fn();setTimeout(()=>{const e=$(h);e&&e.scrollIntoView({block:"center"})},0)}else fn()}
